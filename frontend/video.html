<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safety Briefing Video</title>
  <link rel="stylesheet" href="./src/tail.css" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="bg-black overflow-hidden text-white">
  <div class="navPage w-full h-[50px] absolute top-6 text-white z-20">
    <div class="leftIcons flex gap-5 items-center disaster-module">
      <a href="./student.html"><li>Home</li></a>
      <a id="nav-book" href="./module.html"><li>Book</li></a>
      <a id="nav-quiz" href="./quiz.html"><li>Quiz</li></a>
    </div>
  </div>

  <div class="justify-center items-center flex h-full px-6">
    <div id="briefing-player" class="relative w-[75%] max-w-4xl h-[70%] rounded-2xl border border-white/25 bg-zinc-950 overflow-hidden shadow-2xl flex flex-col justify-between">
      <img id="briefing-bg" src="" alt="" class="absolute inset-0 w-full h-full object-cover opacity-20 pointer-events-none" />
      <div class="relative z-10 p-6 md:p-10 flex-1 flex flex-col justify-center">
        <div class="flex items-center gap-3 mb-4">
          <span id="phase-badge" class="px-3 py-1 rounded-full text-xs font-bold tracking-widest bg-blue-600 text-white">BEFORE</span>
          <span id="step-counter" class="text-sm text-gray-400">Chapter 1 / 3</span>
        </div>
        <h2 id="briefing-heading" class="text-2xl md:text-4xl font-bold mb-6">Loading briefing...</h2>
        <ul id="briefing-points" class="space-y-3 text-base md:text-lg text-gray-200" style="font-family: 'Roboto Mono', monospace;"></ul>
      </div>

      <div class="relative z-10 bg-black/80 border-t border-white/15 px-6 py-4 flex items-center justify-between gap-4 flex-wrap">
        <div class="flex items-center gap-3">
          <button id="prev-slide" class="px-4 py-1.5 rounded-full border border-white/30 hover:bg-white/10 text-sm cursor-pointer">◀ Prev</button>
          <button id="play-toggle" class="px-5 py-1.5 rounded-full bg-blue-600 hover:bg-blue-700 text-sm font-semibold cursor-pointer">❚❚ Pause Auto-Play</button>
          <button id="next-slide" class="px-4 py-1.5 rounded-full border border-white/30 hover:bg-white/10 text-sm cursor-pointer">Next ▶</button>
        </div>
        <div id="progress-dots" class="flex gap-2"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/verify.js"></script>
  <script type="module" src="./src/dynamicVideo.js"></script>
</body>
</html>
